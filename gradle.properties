# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
android.suppressUnsupportedCompileSdk=35

# Network resilience: give dependency resolution generous timeouts so slow or
# flaky connections to Maven Central / Google's Maven repo don't trip HTTP 429
# / connection resets during a fresh (cache-miss) CI run.
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.http.connectionTimeout=180000

# YouTube Data API v3 key for "My Channel" uploads (empty = use key-free RSS feed).
# Set this via CI secret / local override to stabilize channel listing.
YOUTUBE_DATA_API_KEY=
