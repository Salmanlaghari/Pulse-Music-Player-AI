name: Android Automated Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore release-keystore.jks \
            -alias pulse-release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass pulse123456 \
            -keypass pulse123456 \
            -dname "CN=Salman Laghari, OU=Mobile, O=Pulse Music, L=Islamabad, S=Federal, C=PK"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: pulse123456
          KEY_ALIAS: pulse-release
          KEY_PASSWORD: pulse123456

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Files
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Pulse-Music-Player-AI-${{ steps.version.outputs.version }}-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/Pulse-Music-Player-AI-${{ steps.version.outputs.version }}-Release.apk
          ls -lh release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Music-Player-AI-${{ steps.version.outputs.version }}
          path: release-output/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Pulse Music Player AI v${{ steps.version.outputs.version }}"
          body: |
            ## Pulse Music Player AI ${{ steps.version.outputs.version }}

            ### What's New
            - MP3 to MP4 Video Studio with Live Visualizer Preview
            - Premium AI Assistant Banner
            - Fixed See All navigation buttons
            - 10+ Visualizer presets with real-time animation
            - Background style selector
            - 720p and 1080p video export
            - Performance improvements and bug fixes

            ### Download
            Download the APK below and install on your Android device.
          files: release-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
