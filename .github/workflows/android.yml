name: Build & Export Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 4 artifacts (Debug/Release × APK/AAB)
    runs-on: ubuntu-latest

    # Release signing is driven by GitHub Secrets so the SAME keystore (and thus
    # the same SHA-1/SHA-256 fingerprints) signs every release build.
    env:
      # Gradle resolves signingConfigs storeFile relative to the module dir (app/),
      # so this is module-relative (resolves to app/keystore/pulse-release.keystore).
      RELEASE_KEYSTORE_FILE: keystore/pulse-release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cache Gradle + the build cache so all four build tasks reuse work and we
      # don't quadruple total CI time.
      #
      # Use the current, non-deprecated setup-gradle action (v3 had a broken
      # cache-restore path that returned HTTP 400, so the dependency cache never
      # restored and every run re-downloaded everything from Maven Central /
      # Google's Maven repo -> HTTP 429 rate limits). v4's built-in caching
      # stores GRADLE_USER_HOME (~/.gradle/caches + ~/.gradle/wrapper) and
      # is enabled by default. We do NOT set cache-read-only so push builds save
      # the cache for the next run to reuse.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Install the Android SDK (platform + build-tools) for the compileSdk used
      # by the module, and accept licenses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager --version

      # Restore the release keystore from a GitHub secret (base64-encoded). The
      # SAME keystore signs every release build, so the SHA-1/SHA-256 fingerprints
      # stay stable across all future builds. The raw .keystore is never
      # committed to the repo.
      - name: Restore release keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/pulse-release.keystore
          echo "Restored release keystore ($(wc -c < app/keystore/pulse-release.keystore) bytes)."

      # Print only the public certificate fingerprints + validity (safe to log) to
      # confirm the secret-based keystore is the expected one and signing is consistent.
      - name: Verify release keystore fingerprint
        run: |
          keytool -list -v \
            -keystore app/keystore/pulse-release.keystore \
            -alias "$RELEASE_KEY_ALIAS" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -Ei "Alias name|SHA1|SHA256|MD5|Valid from|until" || true

      # Gradle does not auto-retry HTTP 429s, so wrap the invocation in a retry
      # loop as a pragmatic safety net (caching above is the real fix).
      - name: Run Unit Tests
        run: |
          retry() {
            local attempt=1 max=6
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed (possible transient 429/network); retrying in 30s..."
              attempt=$((attempt + 1))
              sleep 30
            done
          }
          retry ./gradlew testDebugUnitTest --no-daemon

      # One Gradle invocation builds all four artifacts, reusing the Gradle/build
      # cache across tasks in this single job.
      - name: Build Debug APK / Debug AAB / Release APK / Release AAB
        run: |
          retry() {
            local attempt=1 max=6
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed (possible transient 429/network); retrying in 30s..."
              attempt=$((attempt + 1))
              sleep 30
            done
          }
          retry ./gradlew assembleDebug bundleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
