name: Android Build & Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: pulse123456
          KEY_ALIAS: pulse-release
          KEY_PASSWORD: pulse123456

      - name: Get Version
        id: ver
        run: echo "version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

      - name: List APKs
        run: ls -lh app/build/outputs/apk/release/ app/build/outputs/apk/debug/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v${{ steps.ver.outputs.version }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Pulse Music Player AI v${{ steps.ver.outputs.version }}"
          body: |
            ## Pulse Music Player AI ${{ steps.ver.outputs.version }}
            - MP3 to MP4 Video Studio with Live Preview
            - Premium AI Assistant
            - Fixed See All buttons
            - 10+ Visualizer presets
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
