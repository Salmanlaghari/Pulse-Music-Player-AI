name: Build & Export Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: build-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 4 artifacts (Debug/Release × APK/AAB)
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_FILE: keystore/pulse-release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager --version
      - name: Restore release keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/pulse-release.keystore
      - name: Verify release keystore fingerprint
        run: |
          keytool -list -v \
            -keystore app/keystore/pulse-release.keystore \
            -alias "$RELEASE_KEY_ALIAS" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -Ei "Alias name|SHA1|SHA256|MD5|Valid from|until" || true
      - name: Run Unit Tests
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed; retrying in 20s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          if ! retry bash -o pipefail -c './gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-test.log'; then
            summary=$(tail -n 80 gradle-test.log | tr '\n' ' ' | cut -c1-9000)
            echo "::error title=Gradle test failure::$summary"
            exit 1
          fi
      - name: Build Debug APK / Debug AAB / Release APK / Release AAB
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed; retrying in 20s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          if ! retry bash -o pipefail -c './gradlew assembleDebug bundleDebug assembleRelease bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log'; then
            summary=$(tail -n 80 gradle-build.log | tr '\n' ' ' | cut -c1-9000)
            echo "::error title=Gradle build failure::$summary"
            exit 1
          fi
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
