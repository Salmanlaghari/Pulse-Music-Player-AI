name: Build & Export Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 4 artifacts (Debug/Release × APK/AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cache Gradle + the build cache so all four build tasks reuse work and we
      # don't quadruple total CI time.
      #
      # Use the current, non-deprecated setup-gradle action (v3 had a broken
      # cache-restore path that returned HTTP 400, so the dependency cache never
      # restored and every run re-downloaded everything from Maven Central /
      # Google's Maven repo -> HTTP 429 rate limits). v4's built-in caching
      # stores GRADLE_USER_HOME (~/.gradle/caches + ~/.gradle/wrapper) and is
      # enabled by default. We do NOT set cache-read-only so push builds save
      # the cache for the next run to reuse.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Install the Android SDK (platform + build-tools) for the compileSdk used
      # by the module, and accept licenses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager --version

      # Safety net: if a release keystore is ever missing, generate one so the
      # Release build is genuinely signed (NOT debug-signed) instead of failing.
      # NOTE: this is a CI-generated dev keystore — rotate to a real Play upload
      # key before publishing to the Play Store.
      - name: Ensure release keystore exists
        run: |
          if [ ! -f app/keystore/pulse-release.keystore ]; then
            mkdir -p app/keystore
            keytool -genkeypair -v \
              -keystore app/keystore/pulse-release.keystore \
              -alias pulse-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pulseMusic2025 -keypass pulseMusic2025 \
              -dname "CN=Pulse Music Player, OU=Dev, O=Pulse, L=NA, S=NA, C=US"
          fi

      # Gradle does not auto-retry HTTP 429s, so wrap the invocation in a small
      # retry loop as a pragmatic safety net (caching above is the real fix).
      - name: Run Unit Tests
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed (possible transient 429/network); retrying in 20s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          retry ./gradlew testDebugUnitTest --no-daemon

      # One Gradle invocation builds all four artifacts, reusing the Gradle/build
      # cache across tasks in this single job.
      - name: Build Debug APK / Debug AAB / Release APK / Release AAB
        run: |
          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Gradle failed after $max attempts"
                return 1
              fi
              echo "::warning::Attempt $attempt failed (possible transient 429/network); retrying in 20s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          retry ./gradlew assembleDebug bundleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
